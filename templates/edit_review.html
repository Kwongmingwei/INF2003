<h2>Edit Your Review</h2>

<form method="POST">
    <label for="summary">Review Summary:</label><br>
    <input type="text" id="summary" name="summary" value="{{ review.review_summary }}"><br><br>

    <label for="rating">Rating (0-5):</label><br>
    <input type="number" id="rating" name="rating" min="0" max="5" value="{{ review.rating }}"><br><br>

    <button type="submit">Update Review</button>
</form>

<a href="{{ url_for('book_detail', book_id=book_id) }}">← Back to Book</a>
