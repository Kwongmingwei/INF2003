<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="login-form">
      <h2>Login</h2>
      <form action="/login" method="POST">
        <label for="username">Username:</label>
        <input
          type="text"
          id="username"
          name="username"
          class="input-field"
          required
        />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          class="input-field"
          required
        />

        <button type="submit">Login</button>
      </form>
      <a href="/" class="back-button">← Back to Home</a>
    </div>
  </body>
</html>
