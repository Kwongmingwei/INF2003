{% extends "base.html" %} {% block content %}

<div class="search-bar">
  <form
    hx-get="/search"
    hx-target="#book-results"
    hx-push-url="true"
    class="search-form"
  >
    <div class="search-container">
      <input
        type="text"
        name="query"
        placeholder="Search books, authors..."
        class="search-input"
        id="search-input"
      />
      <select name="searchDropdown" id="searchDropdown" class="search-dropdown">
        <option value="title">Title</option>
        <option value="author">Author</option>
      </select>
      <button type="button" class="filters-button" onclick="openFiltersModal()">
        Advanced Filters
      </button>
      <button type="submit" class="search-button">Search</button>
    </div>

    <input type="hidden" name="genres" id="hidden-genres" value="" />
    <input
      type="hidden"
      name="searchType"
      id="hidden-search-type"
      value="all"
    />
  </form>
</div>

<div class="active-filters" id="active-filters" style="display: none">
  <h3>Active Filters:</h3>
  <div class="filter-tags" id="filter-tags"></div>
  <button type="button" class="clear-filters-btn" onclick="clearAllFilters()">
    Clear All
  </button>
</div>

<h1>BOOOKS</h1>
<p>Top Genres (Debug): {{ top_genres }}</p>
<div id="book-results">{% include "partials/book_list.html" %}</div>

<div class="modal-overlay" id="filters-modal" onclick="closeFiltersModal()">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>Advanced Filters</h2>
      <button class="close-btn" onclick="closeFiltersModal()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="filter-section">
        <label class="filter-label">Genres:</label>
        <div class="genre-search-container">
          <input
            type="text"
            id="genre-filter-input"
            placeholder="Search genres..."
            class="genre-search-input"
          />
          <div class="genre-grid" id="genre-grid"></div>
        </div>
        <div class="selected-genres" id="selected-genres"></div>
      </div>

      <div class="filter-section">
        <label class="filter-label">Publication Year:</label>
        <div class="year-inputs">
          <input
            type="number"
            id="year-from"
            placeholder="From"
            class="year-input"
          />
          <span>to</span>
          <input
            type="number"
            id="year-to"
            placeholder="To"
            class="year-input"
          />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="clear-btn" onclick="resetFilters()">Clear All</button>
      <button class="apply-btn" onclick="applyFilters()">Apply Filters</button>
    </div>
  </div>
</div>

<script>
  const genres = {{ all_genres | tojson | safe }};
  const topGenres = {{ top_genres | tojson | safe }};
  let selectedGenres = [];
  let allGenres = [...genres];
  console.log("Top genres:", topGenres);

  function openFiltersModal() {
    document.getElementById("filters-modal").style.display = "flex";

    // Clear input
    const input = document.getElementById("genre-filter-input");
    input.value = "";

    populateGenreGrid(topGenres);

    document.body.style.overflow = "hidden";
  }

  function closeFiltersModal() {
    document.getElementById("filters-modal").style.display = "none";
    document.body.style.overflow = "auto";
  }

  function populateGenreGrid(genresToShow) {
    const grid = document.getElementById("genre-grid");
    grid.innerHTML = "";

    genresToShow.slice(0, 15).forEach((genre) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "genre-tag";
      button.textContent = genre;
      button.onclick = () => toggleGenre(genre, button);

      if (selectedGenres.includes(genre)) {
        button.classList.add("selected");
      }

      grid.appendChild(button);
    });

    if (genresToShow.length > 15) {
      const moreButton = document.createElement("div");
      moreButton.className = "more-genres";
      moreButton.textContent = `+${genresToShow.length - 15} more genres`;
      grid.appendChild(moreButton);
    }
  }

  function toggleGenre(genre, button) {
    if (selectedGenres.includes(genre)) {
      selectedGenres = selectedGenres.filter((g) => g !== genre);
      button.classList.remove("selected");
    } else {
      selectedGenres.push(genre);
      button.classList.add("selected");
    }
    updateSelectedGenresDisplay();
  }

  function updateSelectedGenresDisplay() {
    const container = document.getElementById("selected-genres");
    container.innerHTML = "";

    selectedGenres.forEach((genre) => {
      const tag = document.createElement("span");
      tag.className = "selected-genre-tag";
      tag.innerHTML = `${genre} <button onclick="removeGenre('${genre.replace(
        /'/g,
        "\\'"
      )}')">×</button>`;
      container.appendChild(tag);
    });
  }

  function removeGenre(genre) {
    selectedGenres = selectedGenres.filter((g) => g !== genre);
    updateSelectedGenresDisplay();
    populateGenreGrid(getFilteredGenres());
  }

  function getFilteredGenres() {
    const searchTerm = document
      .getElementById("genre-filter-input")
      .value.toLowerCase();
    return allGenres.filter((genre) =>
      genre.toLowerCase().includes(searchTerm)
    );
  }

  function applyFilters() {
    const yearFrom = document.getElementById("year-from").value;
    const yearTo = document.getElementById("year-to").value;

    document.getElementById("hidden-genres").value = selectedGenres.join(",");
    document.getElementById("hidden-search-type").value = "all";

    updateActiveFiltersDisplay();
    closeFiltersModal();

    document.querySelector(".search-form").requestSubmit();
  }

  function updateActiveFiltersDisplay() {
    const activeFilters = document.getElementById("active-filters");
    const filterTags = document.getElementById("filter-tags");

    let hasFilters = false;
    filterTags.innerHTML = "";

    if (selectedGenres.length > 0) {
      const genreTag = document.createElement("span");
      genreTag.className = "filter-tag";
      genreTag.textContent = `Genres: ${selectedGenres.slice(0, 3).join(", ")}${
        selectedGenres.length > 3 ? "..." : ""
      }`;
      filterTags.appendChild(genreTag);
      hasFilters = true;
    }

    const searchType = "all";
    if (searchType !== "all") {
      const typeTag = document.createElement("span");
      typeTag.className = "filter-tag";
      typeTag.textContent = `Search: ${searchType}`;
      filterTags.appendChild(typeTag);
      hasFilters = true;
    }

    activeFilters.style.display = hasFilters ? "block" : "none";
  }

  function clearAllFilters() {
    selectedGenres = [];
    document.getElementById("year-from").value = "";
    document.getElementById("year-to").value = "";

    updateSelectedGenresDisplay();
    updateActiveFiltersDisplay();

    document.getElementById("hidden-genres").value = "";
    document.getElementById("hidden-search-type").value = "all";

    document.querySelector(".search-form").dispatchEvent(new Event("submit"));
  }

  function resetFilters() {
    clearAllFilters();
    closeFiltersModal();
  }

  document.getElementById("genre-filter-input").addEventListener("input", function () {
    if (this.value.trim() === "") {
      populateGenreGrid(topGenres);
    } else {
      const filtered = getFilteredGenres();
      populateGenreGrid(filtered);
    }
  });

  
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeFiltersModal();
    }
  });
</script>
{% endblock %}
