{% for book in books %}
  <div class="book-card">
    <h2>
      <a href="{{ url_for('book_detail', book_id=book.work_id) }}">{{ book.title }}</a>
    </h2>
    <p><strong>Author(s):</strong> {{ book.authors }}</p>
    <p><strong>Genre(s):</strong> {{ book.genres }}</p>
  </div>
{% else %}
  <p>No books found.</p>
{% endfor %}
